    *{box-sizing:border-box}
    html{font-size:16px}
    @media(min-width:1700px){html{font-size:18px}}

    body{
      margin:0;
      min-height:100vh;
      background:var(--ground);
      color:var(--ink);
      font-family:"Geist",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      font-size:.875rem;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }

    button,input{font:inherit;color:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    svg{display:block;flex:none}
    .icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    [hidden]{display:none!important}
    .nb{white-space:nowrap}
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    .shell{
      display:grid;
      grid-template-columns:var(--sidebar) minmax(0,1fr);
      min-height:100vh;
    }

    /* ---------- Barra lateral ---------- */
    .shell{
      display:grid;
      grid-template-columns:calc(var(--sidebar) + 24px) minmax(0,1fr);
      min-height:100vh;
    }

    .sidebar{
      position:sticky;
      top:12px;
      height:calc(100vh - 24px);
      margin:12px;
      padding:22px 12px 12px;
      display:flex;
      flex-direction:column;
      background:var(--surface);
      border-radius:var(--r-l);
    }

    .brand{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:12px;
      margin:0 6px 28px;
    }

    .brand-mark{
      flex:none;
      width:120px;
      height:68px;
      background:var(--logo) left center/contain no-repeat;
    }

    .brand-name{display:block;min-width:0}
    .brand-name strong{display:block;font-size:.9375rem;font-weight:600;line-height:1.2}
    .brand-name span{display:block;margin-top:3px;font-size:.75rem;color:var(--muted)}

    .nav{display:grid;gap:2px}

    .nav-item{
      width:100%;
      height:38px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 12px;
      border:0;
      border-radius:var(--r-s);
      background:transparent;
      color:var(--muted);
      font-size:.875rem;
      text-align:left;
      transition:background-color .12s ease,color .12s ease;
    }
    .nav-item:hover{color:var(--ink);background:var(--hover)}
    .nav-item[aria-current="page"]{color:var(--ink);background:var(--control);font-weight:500}

    .sidebar-foot{margin-top:auto;display:grid;gap:2px}

    /* ---------- Canvas ---------- */
    .canvas{
      min-width:0;
      min-height:100vh;
      padding:12px var(--gutter) 20px 0;
      display:flex;
      flex-direction:column;
    }

    .mobile-bar,.tabs{display:none}

    /* ---------- Abertura ---------- */
    .hero{
      position:relative;
      isolation:isolate;
      overflow:hidden;
      display:grid;
      place-content:center;
      min-height:300px;
      padding:56px 24px;
      border-radius:var(--r-l);
      background:#171757;
      color:#ffffff;
      text-align:center;
    }
    .hero-art{position:absolute;inset:0;z-index:-2}
    .hero-art svg{width:100%;height:100%}
    .hero::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(9,9,26,.7)}

    h1{
      margin:0;
      font-size:clamp(2.75rem,6.6vw,5.75rem);
      font-weight:500;
      line-height:1;
      letter-spacing:-.045em;
    }

    .hero-sub{
      max-width:52ch;
      margin:18px auto 0;
      color:rgba(255,255,255,.86);
      font-size:1.0625rem;
      line-height:1.5;
    }

    .hero[data-compact="true"]{
      display:block;
      min-height:0;
      padding:28px 0 20px;
      background:none;
      color:var(--ink);
      text-align:left;
      overflow:visible;
    }
    .hero[data-compact="true"] .hero-art,
    .hero[data-compact="true"]::before{display:none}
    .hero[data-compact="true"] h1{font-size:1.75rem;letter-spacing:-.02em;line-height:1.25}
    .hero[data-compact="true"] .hero-sub{max-width:none;margin:6px 0 0;color:var(--muted);font-size:.875rem;font-variant-numeric:tabular-nums}

    .banner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px 24px;
      flex-wrap:wrap;
      margin-top:16px;
      padding:14px 22px;
      background:var(--surface);
      border-radius:var(--r);
    }
    .banner-main{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
    .banner-label{color:var(--muted);font-size:.8125rem}
    .figure{
      font-size:1.625rem;
      font-weight:400;
      line-height:1.1;
      letter-spacing:-.02em;
      font-variant-numeric:tabular-nums;
      color:var(--accent);
    }
    .figure.is-empty{color:var(--muted)}
    .condition{color:var(--ink);font-size:.875rem}
    .banner-time{color:var(--muted);font-size:.875rem;font-variant-numeric:tabular-nums}
    .banner-time strong{color:var(--ink);font-weight:500;margin-left:6px}

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px 24px;
      margin:32px 0 16px;
    }
    .toolbar h2,.section-title{margin:0;font-size:1.125rem;font-weight:600;letter-spacing:-.01em}
    .count{margin-left:12px;color:var(--muted);font-size:.8125rem;font-weight:400;font-variant-numeric:tabular-nums}

    .search{
      width:min(360px,100%);
      height:40px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 8px 0 14px;
      border:1px solid var(--border);
      border-radius:var(--r-s);
      background:var(--surface);
      color:var(--muted);
    }
    .search:focus-within{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
    .search[hidden]{display:none}
    .search input{
      flex:1;
      min-width:0;
      height:100%;
      border:0;
      outline:0;
      background:transparent;
      color:var(--ink);
      font-size:.875rem;
    }
    .search input::placeholder{color:var(--muted);opacity:1}
    .search input::-webkit-search-cancel-button{display:none}
    .search kbd{
      min-width:22px;
      height:22px;
      display:grid;
      place-items:center;
      border:1px solid var(--border);
      border-radius:4px;
      font:inherit;
      font-size:.75rem;
      color:var(--muted);
    }

    /* ---------- Cartões das aplicações ---------- */
    .cards,.tiles{
      list-style:none;
      margin:0;
      padding:0;
      display:grid;
      gap:16px;
    }
    .cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
    .tiles{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}

    .card{
      position:relative;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      border-radius:var(--r);
      background:var(--surface);
      transition:transform .18s ease,background-color .18s ease;
    }
    .card:hover{transform:translateY(-3px);background:var(--hover)}

    .cover{aspect-ratio:16 / 9;overflow:hidden;background:#171757}
    .cover svg{width:100%;height:100%;transition:transform .45s ease}
    .card:hover .cover svg{transform:scale(1.045)}

    .card-body{flex:1;display:flex;flex-direction:column;padding:14px 16px 16px}
    .card-title{margin:0;font-size:.9375rem;font-weight:600;line-height:1.3}
    .card-desc{
      margin:4px 0 0;
      color:var(--muted);
      font-size:.8125rem;
      line-height:1.5;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;padding:0}
    .chip{
      display:inline-flex;
      align-items:center;
      height:22px;
      padding:0 9px;
      border-radius:11px;
      background:var(--control);
      color:var(--muted);
      font-size:.75rem;
    }
    .card-actions{display:flex;gap:8px;margin-top:auto;padding-top:16px}

    .open{
      flex:1;
      height:38px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:0 14px;
      border:0;
      border-radius:var(--r-s);
      background:var(--action);
      color:var(--on-action);
      font-size:.8125rem;
      font-weight:600;
      transition:filter .12s ease;
    }
    .open:hover{filter:brightness(1.07)}
    .open .icon{width:14px;height:14px}
    /* O link cobre o cartão inteiro; a estrela fica por cima */
    .open::after{content:"";position:absolute;inset:0}
    .open:focus-visible{outline-offset:-3px}

    .fav{
      position:relative;
      z-index:1;
      flex:none;
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border:1px solid var(--border);
      border-radius:var(--r-s);
      background:transparent;
      color:var(--muted);
      transition:background-color .12s ease,color .12s ease,border-color .12s ease;
    }
    .fav:hover{background:var(--control);color:var(--ink)}
    .fav[aria-pressed="true"]{color:var(--ink);border-color:var(--muted)}
    .fav[aria-pressed="true"] .icon{fill:currentColor}

    .status{
      flex:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:38px;
      border-radius:var(--r-s);
      background:var(--control);
      color:var(--muted);
      font-size:.8125rem;
      white-space:nowrap;
    }

    .card.is-disabled .cover{filter:grayscale(.85);opacity:.7}
    .card.is-disabled .card-title{color:var(--muted)}
    .card.is-disabled:hover{transform:none;background:var(--surface)}

    .tile{position:relative;border-radius:var(--r);background:var(--surface);transition:background-color .15s ease}
    .tile:hover{background:var(--hover)}
    .tile a{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:12px;
      align-items:center;
      min-height:72px;
      padding:14px 18px;
    }
    .tile strong{display:block;font-weight:600;font-size:.9375rem}
    .tile .d{display:block;margin-top:2px;color:var(--muted);font-size:.8125rem;line-height:1.45}
    .tile .icon{color:var(--muted)}
    .tile a:focus-visible{outline-offset:-2px;border-radius:var(--r)}

    .empty{
      padding:40px 0;
      color:var(--muted);
      font-size:.875rem;
    }
    .empty p{margin:0 0 12px;max-width:46ch}
    .empty-btn{
      height:34px;
      padding:0 14px;
      border:0;
      border-radius:var(--r-s);
      background:var(--control);
      color:var(--ink);
      font-size:.8125rem;
      font-weight:500;
    }
    .empty-btn:hover{background:var(--border)}

    .panel{background:var(--surface);border-radius:var(--r);overflow:hidden}
    .about{padding:24px;max-width:720px}
    .about p{margin:0 0 20px;font-size:.9375rem;line-height:1.6}
    .facts{display:grid;grid-template-columns:auto 1fr;gap:8px 32px;margin:0;font-variant-numeric:tabular-nums}
    .facts dt{color:var(--muted)}
    .facts dd{margin:0;text-align:right}

    .links-section{margin-top:8px}

    /* ---------- Administração e diálogo ---------- */
    .admin{padding:24px;display:grid;gap:32px}
    .admin-sec h2{margin:0 0 4px;font-size:.9375rem;font-weight:600}
    .admin-sec .hint,.dlg .hint{margin:0 0 16px;color:var(--muted);font-size:.8125rem;line-height:1.5;max-width:64ch}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;max-width:760px}
    .form-grid .wide{grid-column:1 / -1}
    .field{display:grid;gap:6px;margin-bottom:14px}
    .field label{font-size:.8125rem;color:var(--muted)}
    .field input,.field select,.field textarea{
      width:100%;
      height:38px;
      padding:0 12px;
      border:1px solid var(--border);
      border-radius:var(--r-s);
      background:var(--surface);
      color:var(--ink);
      font-size:.875rem;
    }
    .field textarea{height:150px;padding:10px 12px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem;line-height:1.5} /* taste-skill-ignore: texto de código para colar no arquivo */
    .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
    .err{min-height:1.25em;margin:0 0 12px;color:var(--danger);font-size:.8125rem}
    .ok{color:var(--ink)}
    .btn{height:34px;padding:0 14px;border:0;border-radius:var(--r-s);background:var(--control);color:var(--ink);font-size:.8125rem;font-weight:500}
    .btn:hover{background:var(--border)}
    .btn.primary{background:var(--action);color:var(--on-action)}
    .btn.primary:hover{background:var(--action);filter:brightness(1.07)}
    .btn[disabled]{opacity:.5;cursor:default}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap}
    .added{list-style:none;margin:0;padding:0;max-width:760px;border:1px solid var(--border);border-radius:var(--r)}
    .added li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule)}
    .added li:last-child{border-bottom:0}
    .added strong{font-weight:500}
    .added .status{flex:none;height:22px;padding:0 9px;margin-left:6px;border-radius:11px;font-size:.75rem}
    .added .meta{display:block;color:var(--muted);font-size:.8125rem;overflow-wrap:anywhere}
    .added-empty{margin:0;color:var(--muted);font-size:.8125rem}

    dialog.dlg{
      width:min(400px,calc(100vw - 32px));
      padding:24px;
      border:1px solid var(--border);
      border-radius:var(--r);
      background:var(--surface);
      color:var(--ink);
      box-shadow:0 12px 40px rgba(0,0,0,.2); /* taste-skill-ignore: diálogo flutuante */
    }
    dialog.dlg::backdrop{background:rgba(16,17,19,.5)}
    .dlg h2{margin:0 0 4px;font-size:1rem;font-weight:600}
    .dlg-actions{display:flex;justify-content:flex-end;gap:8px}

    .foot{
      margin-top:auto;
      padding-top:32px;
      color:var(--muted);
      font-size:.75rem;
    }

    /* ---------- Telefone e tablet ---------- */
    @media(max-width:920px){
      :root{--gutter:16px}
      .shell{display:block}
      .sidebar{display:none}

      .mobile-bar{
        position:sticky;
        top:0;
        z-index:10;
        margin:-12px -16px 0;
        height:60px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:0 16px;
        background:var(--ground);
      }
      .mobile-bar .brand{margin:0;gap:10px;flex-direction:row;align-items:center}
      .mobile-bar .brand-mark{width:76px;height:44px}
      .icon-btn{
        width:38px;
        height:38px;
        display:grid;
        place-items:center;
        border:1px solid var(--border);
        border-radius:var(--r-s);
        background:var(--surface);
        color:var(--ink);
      }

      .tabs{
        display:flex;
        gap:4px;
        margin:0 -16px;
        padding:8px 16px 12px;
        overflow-x:auto;
        scrollbar-width:none;
      }
      .tabs::-webkit-scrollbar{display:none}
      .tabs .nav-item{width:auto;flex:none;height:36px;padding:0 14px}

      .canvas{min-height:0;padding:12px 16px 20px}
      .hero{min-height:230px;padding:40px 16px}
      .hero-sub{font-size:1rem}
      .toolbar{flex-direction:column;align-items:stretch;margin:28px 0 14px}
      .toolbar h2{align-self:flex-start}
      .search{width:100%;height:44px}
      .search kbd{display:none}
      .cards,.tiles{grid-template-columns:minmax(0,1fr)}
      .form-grid{grid-template-columns:1fr}
      .admin{padding:16px}
      .banner{padding:14px 16px}
    }

    @media(prefers-reduced-motion:reduce){
      *{transition:none!important}
    }
  </style>
</head>

<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <span class="brand-mark" role="img" aria-label="JBS Terminais"></span>
        <span class="brand-name"><strong>Operational Hub</strong><span>Terminal de Itajaí</span></span>
      </div>

      <nav class="nav">
        <button class="nav-item" type="button" data-view="all" aria-current="page">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
          <span>Início</span>
        </button>
        <button class="nav-item" type="button" data-view="favorites">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
          <span>Favoritos</span>
        </button>
        <button class="nav-item" type="button" data-view="links">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></svg>
          <span>Links úteis</span>
        </button>
        <button class="nav-item" type="button" data-view="about">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
          <span>Sobre</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <button class="nav-item" type="button" data-view="admin">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <span>Administrar</span>
        </button>
        <button class="nav-item" type="button" data-theme-toggle>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" data-theme-icon></svg>
          <span data-theme-label>Tema escuro</span>
        </button>
      </div>
    </aside>

    <main class="canvas">
      <div class="mobile-bar">
        <div class="brand">
          <span class="brand-mark" role="img" aria-label="JBS Terminais"></span>
          <span class="brand-name"><strong>Operational Hub</strong></span>
        </div>
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Alternar tema">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" data-theme-icon></svg>
        </button>
      </div>

      <nav class="tabs" aria-label="Seções">
        <button class="nav-item" type="button" data-view="all" aria-current="page"><span>Início</span></button>
        <button class="nav-item" type="button" data-view="favorites"><span>Favoritos</span></button>
        <button class="nav-item" type="button" data-view="links"><span>Links úteis</span></button>
        <button class="nav-item" type="button" data-view="about"><span>Sobre</span></button>
        <button class="nav-item" type="button" data-view="admin"><span>Administrar</span></button>
      </nav>

      <header class="hero" id="hero" data-compact="false">
        <div class="hero-art" id="heroArt" aria-hidden="true"></div>
        <h1 id="sectionTitle">Operational Hub</h1>
        <p class="hero-sub" id="summary"></p>
      </header>

      <section class="banner" id="banner" aria-label="Itajaí agora">
        <div class="banner-main">
          <span class="banner-label">Itajaí agora</span>
          <span class="figure is-empty" id="weatherTemp">--°C</span>
          <span class="condition" id="weatherCondition">Atualizando...</span>
        </div>
        <div class="banner-time"><span id="dateText"></span><strong id="clock"></strong></div>
      </section>

      <div class="toolbar" id="toolbar">
        <h2><span id="listTitle">Aplicações</span><span class="count" id="count"></span></h2>
        <label class="search" id="searchBox">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="Buscar aplicação ou link" aria-label="Buscar aplicação ou link" autocomplete="off" />
          <kbd aria-hidden="true">/</kbd>
        </label>
      </div>

      <section id="listPanel" aria-labelledby="listTitle">
        <ul class="cards" id="appsGrid"></ul>
        <div class="empty" id="emptyState" hidden></div>
        <div class="panel about" id="aboutBox" hidden></div>
        <div class="panel admin" id="adminBox" hidden></div>
      </section>

      <section class="links-section" id="linksSection" aria-labelledby="linksTitle">
        <div class="toolbar"><h2 id="linksTitle">Links úteis</h2></div>
        <ul class="tiles" id="portLinks"></ul>
      </section>

      <footer class="foot">JBS Terminais Itajaí &middot; Operational Hub v1.2</footer>
    </main>
  </div>

  <dialog class="dlg" id="authDialog" aria-labelledby="authTitle">
    <form id="authForm" novalidate>
      <h2 id="authTitle">Acesso de administrador</h2>
      <p class="hint" id="authHint"></p>
      <div class="field"><label for="authUser">Usuário</label><input id="authUser" autocomplete="username" /></div>
      <div class="field"><label for="authPass">Senha</label><input id="authPass" type="password" autocomplete="current-password" /></div>
      <div class="field" id="authConfirmRow" hidden><label for="authConfirm">Confirmar senha</label><input id="authConfirm" type="password" autocomplete="new-password" /></div>
      <p class="err" id="authErr" role="alert"></p>
      <div class="dlg-actions">
        <button class="btn" type="button" id="authCancel">Cancelar</button>
        <button class="btn primary" type="submit" id="authSubmit">Entrar</button>
      </div>
    </form>
  </dialog>

  <script>
    // Edite somente os links abaixo quando quiser apontar as linhas para as aplicações reais.
    const APPS = [
      {
        "id": "yard-dashboard",
        "title": "Yard Dashboard",
        "description": "Acompanhamento operacional da ocupação e indicadores do pátio.",
        "tags": [
          "Pátio",

        ],
        "url": "https://brunosth-rgb.github.io/yard"
      },
      {
        "id": "vessel-dashboard",
        "title": "Vessel Dashboard",
        "description": "Visão operacional dos navios, movimentos e desempenho dos guindastes.",
        "tags": [
          "Navio",
          "Operação"
        ],
        "url": "https://brunosth-rgb.github.io/vessel"
      },
            {
        "id": "gate-dashboard",
        "title": "Gate Dashboard",
        "description": "Monitoramento do fluxo de caminhões e indicadores de atendimento do gate.",
        "tags": [
          "Gate",

      return function(){
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };

    // Pátio visto de cima: quadras de contêineres separadas por ruas
    function yardField(W, H, seed, cw, ch, gap, cols, rows, lane, bg){
      const r = rng(seed);
      const bw = cols * (cw + gap) - gap, bh = rows * (ch + gap) - gap;
      const nx = Math.floor((W + lane) / (bw + lane)), ny = Math.floor((H + lane) / (bh + lane));
      const sx = (W - (nx * bw + (nx - 1) * lane)) / 2, sy = (H - (ny * bh + (ny - 1) * lane)) / 2;
      let s = R(0, 0, W, H, bg);
      for(let by = 0; by < ny; by++) for(let bx = 0; bx < nx; bx++)
        for(let j = 0; j < rows; j++) for(let i = 0; i < cols; i++){
          if(r() < 0.12) continue;
          s += R((sx + bx * (bw + lane) + i * (cw + gap)).toFixed(1), (sy + by * (bh + lane) + j * (ch + gap)).toFixed(1), cw, ch, BOX[Math.floor(r() * BOX.length)], 1);
        }
      return s;
    }

    function stacks(x0, base, n, step, cw, tierH, heights, seed, colors){

      for(let i = 0; i < n; i++) for(let k = 0; k < heights[i]; k++)
        s += R(x0 + i * step, base - (k + 1) * (tierH + 2), cw, tierH, colors ? colors(i, k, heights[i]) : BOX[Math.floor(r() * BOX.length)], 1);
      return s;
    }

      if(term) return plural(visible, "resultado", "resultados") + " para esta busca";

      if(currentView === "all"){
        const dev = allApps().filter(app => app.disabled).length;
        return plural(allApps().length - dev, "disponível", "disponíveis") + ", " + dev + " em desenvolvimento";
      }
      if(currentView === "favorites"){
        return favorites.size + " de " + allApps().filter(app => !app.disabled).length + " aplicações fixadas";
      }
      return plural(total, "link", "links") + " de apoio à operação";
    }

    function render(focusFavorite){
      const term = searchInput.value.trim().toLowerCase();
      const about = currentView === "about";
      const admin = currentView === "admin";
      const links = currentView === "links";
      const home = currentView === "all";
      const listView = !(about || admin);

      titleEl.textContent = ({
        all: "Operational Hub",
        favorites: "Favoritos",
        links: "Links úteis",
        about: "Sobre o Operational Hub",
        admin: "Administração"
      })[currentView];
      listTitleEl.textContent = ({ all: "Aplicações", favorites: "Aplicações fixadas", links: "Links úteis" })[currentView] || "";

      heroEl.dataset.compact = home ? "false" : "true";
      bannerEl.hidden = !home;
      linksSection.hidden = !home;
      countEl.hidden = !home;
      toolbarEl.hidden = !listView;
      searchBox.hidden = !listView;
      listEl.hidden = !listView;
      aboutEl.hidden = !about;
      adminEl.hidden = !admin;

      if(admin){
        emptyEl.hidden = true;
        renderAdmin();
        return;
      }

      if(about){
        emptyEl.hidden = true;
        const available = allApps().filter(app => !app.disabled).length;
        aboutEl.innerHTML =
          '<p>Este hub centraliza dashboards, ferramentas e aplicações operacionais em um único ponto de acesso.</p>' +
          '<dl class="facts">' +
            '<dt>Aplicações disponíveis</dt><dd>' + available + '</dd>' +
            '<dt>Em desenvolvimento</dt><dd>' + (allApps().length - available) + '</dd>' +
            '<dt>Links úteis</dt><dd>' + allLinks().length + '</dd>' +
            '<dt>Versão</dt><dd>1.2</dd>' +
          '</dl>';
        summaryEl.textContent = "JBS Terminais Itajaí";
        return;
      }

      let source = links ? allLinks() : allApps();
      if(currentView === "favorites") source = allApps().filter(app => favorites.has(app.id));

      const items = source.filter(item => matches(item, term));
      listEl.className = links ? "tiles" : "cards";
      listEl.innerHTML = items.map(links ? tileHTML : cardHTML).join("");

      const text = summaryText(items.length, source.length);
      summaryEl.textContent = home ? HERO_TEXT : text;
      countEl.textContent = text;

      emptyEl.hidden = items.length > 0;
      if(items.length === 0){
        if(term){
          emptyEl.innerHTML = '<p>Nenhum resultado para esta busca.</p>';
        }else if(currentView === "favorites"){
          emptyEl.innerHTML = '<p>Nenhum favorito ainda. Use a estrela ao lado de uma aplicação para fixá-la aqui.</p><button class="empty-btn" type="button" data-go="all">Ver todas as aplicações</button>';
        }else{
          emptyEl.innerHTML = '<p>Nada para mostrar aqui.</p>';
        }
      }

      if(focusFavorite){
        const btn = listEl.querySelector('[data-favorite="' + focusFavorite + '"]');
        if(btn) btn.focus();
      }
    }

    function setView(view){
      currentView = view;
      searchInput.value = "";
      document.querySelectorAll("[data-view]").forEach(btn => {
        if(btn.dataset.view === view) btn.setAttribute("aria-current", "page");
        else btn.removeAttribute("aria-current");
      });
      render();
      window.scrollTo({ top:0 });
    }

    document.querySelectorAll("[data-view]").forEach(btn => {
      btn.addEventListener("click", () => {
        if(btn.dataset.view === "admin") requestAdmin();
        else setView(btn.dataset.view);
      });
    });

    listEl.addEventListener("click", event => {
      const favBtn = event.target.closest("[data-favorite]");
      if(favBtn){
        const id = favBtn.dataset.favorite;
        const target = allApps().find(app => app.id === id);
        if(!target || target.disabled) return;
        if(favorites.has(id)) favorites.delete(id);
        else favorites.add(id);
        saveFavorites();
        render(currentView === "favorites" ? null : id);
        return;
      }

      const pending = event.target.closest("[data-pending]");
      if(pending) alert('O link de "' + pending.dataset.pending + '" ainda não foi configurado.');
    });

    emptyEl.addEventListener("click", event => {
      const go = event.target.closest("[data-go]");
      if(go) setView(go.dataset.go);
    });

    searchInput.addEventListener("input", () => render());

    document.addEventListener("keydown", event => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if(event.key === "/" && !typing && !searchBox.hidden){
        event.preventDefault();
        searchInput.focus();
      }
      if(event.key === "Escape" && document.activeElement === searchInput){
        searchInput.value = "";
        render();
        searchInput.blur();
      }
    });

    /* ---------- Links úteis na tela inicial ---------- */
    function renderRail(){
      document.getElementById("portLinks").innerHTML = allLinks().map(tileHTML).join("");
    }

    /* ---------- Administração: acesso por usuário e senha ----------
       Atenção: esta proteção roda no navegador. Ela impede alterações por engano e por
       quem não conhece a senha, mas não substitui um login no servidor. */
    const authDialog = document.getElementById("authDialog");
    const authForm = document.getElementById("authForm");
    const authErr = document.getElementById("authErr");
    const authUser = document.getElementById("authUser");
    const authPass = document.getElementById("authPass");
    const authConfirm = document.getElementById("authConfirm");
    const authConfirmRow = document.getElementById("authConfirmRow");
    let authMode = "login";

    const enc = new TextEncoder();
    function toB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
    function fromB64(text){ return Uint8Array.from(atob(text), c => c.charCodeAt(0)); }

    async function derive(password, salt){
      if(!(window.crypto && crypto.subtle)) throw new Error("no-crypto");
      const key = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name:"PBKDF2", salt, iterations:150000, hash:"SHA-256" }, key, 256);
      return toB64(bits);
    }

    function readCreds(){
      try{
        const c = JSON.parse(localStorage.getItem(STORE_ADMIN) || "null");
        return c && c.user && c.salt && c.hash ? c : null;
      }catch(e){ return null; }
    }

    function isAdmin(){
      const started = Number(sessionStorage.getItem(SESSION_KEY) || 0);
      if(started && Date.now() - started < SESSION_MS){
        sessionStorage.setItem(SESSION_KEY, String(Date.now()));
        return true;
      }
      sessionStorage.removeItem(SESSION_KEY);
      return false;
    }

    function readLock(){
      try{ return JSON.parse(localStorage.getItem(STORE_LOCK) || "{}"); }catch(e){ return {}; }
    }

    function requestAdmin(){
      if(isAdmin()){ setView("admin"); return; }
      const creds = readCreds();
      authMode = creds ? "login" : "setup";
      document.getElementById("authTitle").textContent = creds ? "Acesso de administrador" : "Criar acesso de administrador";
      document.getElementById("authHint").textContent = creds
        ? "Informe usuário e senha para adicionar ou remover aplicações."
        : "Primeiro acesso neste navegador: defina o usuário e a senha que vão proteger a área de administração.";
      document.getElementById("authSubmit").textContent = creds ? "Entrar" : "Criar acesso";
      authPass.autocomplete = creds ? "current-password" : "new-password";
      authConfirmRow.hidden = Boolean(creds);
      authUser.value = ""; authPass.value = ""; authConfirm.value = ""; authErr.textContent = "";
      authDialog.showModal();
      authUser.focus();
    }

    document.getElementById("authCancel").addEventListener("click", () => authDialog.close());

    authForm.addEventListener("submit", async event => {
      event.preventDefault();
      authErr.textContent = "";
      const user = authUser.value.trim();
      const pass = authPass.value;
      const submit = document.getElementById("authSubmit");

      if(!user || !pass){ authErr.textContent = "Preencha usuário e senha."; return; }

      try{
        submit.disabled = true;

        if(authMode === "setup"){
          if(user.length < 3){ authErr.textContent = "O usuário precisa de pelo menos 3 caracteres."; return; }
          if(pass.length < 8){ authErr.textContent = "A senha precisa de pelo menos 8 caracteres."; return; }
          if(pass !== authConfirm.value){ authErr.textContent = "As senhas não coincidem."; return; }
          const salt = crypto.getRandomValues(new Uint8Array(16));
          const hash = await derive(pass, salt);
          localStorage.setItem(STORE_ADMIN, JSON.stringify({ user: user.toLowerCase(), salt: toB64(salt), hash }));
        }else{
          const lock = readLock();
          if(lock.until && Date.now() < lock.until){
            authErr.textContent = "Muitas tentativas. Aguarde " + Math.ceil((lock.until - Date.now()) / 1000) + " s.";
            return;
          }
          const creds = readCreds();
          const hash = creds ? await derive(pass, fromB64(creds.salt)) : "";
          if(!creds || creds.user !== user.toLowerCase() || creds.hash !== hash){
            const count = (lock.count || 0) + 1;
            const next = count >= 5 ? { count: 0, until: Date.now() + 60000 } : { count, until: 0 };
            try{ localStorage.setItem(STORE_LOCK, JSON.stringify(next)); }catch(e){}
            authErr.textContent = count >= 5 ? "Muitas tentativas. Aguarde 60 s." : "Usuário ou senha incorretos.";
            return;
          }
          try{ localStorage.removeItem(STORE_LOCK); }catch(e){}
        }

        sessionStorage.setItem(SESSION_KEY, String(Date.now()));
        authPass.value = ""; authConfirm.value = "";
        authDialog.close();
        setView("admin");
      }catch(error){
        authErr.textContent = error.message === "no-crypto"
          ? "Este endereço não permite criptografia. Abra a página por https."
          : "Não foi possível concluir. Tente novamente.";
      }finally{
        submit.disabled = false;
      }
    });

    function snippet(items){
      return items.map(i => "      " + JSON.stringify({ id:i.id, title:i.title, description:i.description, tags:i.tags, url:i.url })).join(",\n");
    }

    function renderAdmin(message){
      summaryEl.textContent = plural(custom.length, "item adicionado", "itens adicionados") + " neste navegador";

      const list = custom.length
        ? '<ul class="added">' + custom.map(i =>
            '<li><span><strong>' + esc(i.title) + '</strong> <span class="status">' + (i.type === "link" ? "Link útil" : "Aplicação") + '</span>' +
            '<span class="meta">' + esc(i.url) + '</span></span>' +
            '<button class="btn" type="button" data-remove="' + esc(i.id) + '" aria-label="Remover ' + esc(i.title) + '">Remover</button></li>'
          ).join("") + '</ul>'
        : '<p class="added-empty">Nenhum item adicionado ainda.</p>';

      const apps = custom.filter(i => i.type === "app");
      const links = custom.filter(i => i.type === "link");
      const code =
        (apps.length ? "// Cole dentro de APPS:\n" + snippet(apps) + "\n\n" : "") +
        (links.length ? "// Cole dentro de USEFUL_LINKS:\n" + snippet(links) + "\n" : "");

      adminEl.innerHTML =
        '<section class="admin-sec" aria-labelledby="addTitle"><h2 id="addTitle">Nova entrada</h2>' +
          '<p class="hint">O item aparece na tela inicial (aplicação) ou na lista de links úteis. Fica salvo neste navegador.</p>' +
          '<form id="addForm" novalidate><div class="form-grid">' +
            '<div class="field"><label for="addType">Tipo</label><select id="addType"><option value="app">Aplicação</option><option value="link">Link útil</option></select></div>' +
            '<div class="field"><label for="addTitleInput">Nome</label><input id="addTitleInput" maxlength="60" autocomplete="off" /></div>' +
            '<div class="field wide"><label for="addDesc">Descrição</label><input id="addDesc" maxlength="140" autocomplete="off" /></div>' +
            '<div class="field"><label for="addTags">Área (até 3, separadas por vírgula)</label><input id="addTags" autocomplete="off" placeholder="Pátio, Dashboard" /></div>' +
            '<div class="field"><label for="addUrl">Endereço (URL)</label><input id="addUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://" /></div>' +
          '</div>' +
          '<p class="err" id="addErr" role="alert">' + (message ? '<span class="ok">' + esc(message) + '</span>' : '') + '</p>' +
          '<div class="btn-row"><button class="btn primary" type="submit">Adicionar</button></div></form></section>' +
        '<section class="admin-sec" aria-labelledby="listTitle"><h2 id="listTitle">Adicionados neste navegador</h2>' + list + '</section>' +
        '<section class="admin-sec" aria-labelledby="jsonTitle"><h2 id="jsonTitle">Para valer em todos os computadores</h2>' +
          '<p class="hint">Os itens acima só existem neste navegador. Para todos verem (inclusive as TVs), copie o texto abaixo e cole nas listas indicadas dentro do arquivo index.html.</p>' +
          (code ? '<div class="field"><textarea id="jsonOut" readonly aria-label="Texto para colar no arquivo">' + esc(code) + '</textarea></div>' +
                  '<div class="btn-row"><button class="btn" type="button" data-copy>Copiar texto</button></div>'
                : '<p class="added-empty">Nada para copiar ainda.</p>') +
        '</section>' +
        '<section class="admin-sec"><button class="btn" type="button" data-logout>Sair do modo administrador</button></section>';
    }

    adminEl.addEventListener("submit", event => {
      event.preventDefault();
      if(!isAdmin()){ requestAdmin(); return; }

      const type = document.getElementById("addType").value === "link" ? "link" : "app";
      const title = document.getElementById("addTitleInput").value.trim();
      const description = document.getElementById("addDesc").value.trim();
      const tags = document.getElementById("addTags").value.split(",").map(s => s.trim()).filter(Boolean).slice(0, 3);
      let url = document.getElementById("addUrl").value.trim();
      const err = document.getElementById("addErr");

      if(url && !/^[a-z][a-z0-9+.-]*:/i.test(url)) url = "https://" + url;
      if(!title){ err.textContent = "Informe o nome."; return; }
      if(!validUrl(url)){ err.textContent = "Informe um endereço válido, começando com http ou https."; return; }
      const pool = type === "link" ? allLinks() : allApps();
      if(pool.some(i => i.title.toLowerCase() === title.toLowerCase())){ err.textContent = "Já existe um item com este nome."; return; }

      custom.push({ id: "custom-" + Date.now().toString(36), title, description, tags, url, type });
      if(!saveCustom()){ custom.pop(); err.textContent = "Não foi possível salvar neste navegador."; return; }
      renderRail();
      renderAdmin("Adicionado: " + title + ".");
    });

    adminEl.addEventListener("click", event => {
      const remove = event.target.closest("[data-remove]");
      if(remove){
        if(!isAdmin()){ requestAdmin(); return; }
        const id = remove.dataset.remove;
        const item = custom.find(i => i.id === id);
        if(!item || !confirm('Remover "' + item.title + '"?')) return;
        custom = custom.filter(i => i.id !== id);
        favorites.delete(id);
        saveCustom(); saveFavorites();
        renderRail();
        renderAdmin("Removido: " + item.title + ".");
        return;
      }

      if(event.target.closest("[data-copy]")){
        const area = document.getElementById("jsonOut");
        area.select();
        const done = () => { event.target.textContent = "Copiado"; };
        if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(area.value).then(done, () => { document.execCommand("copy"); done(); });
        else { document.execCommand("copy"); done(); }
        return;
      }

      if(event.target.closest("[data-logout]")){
        sessionStorage.removeItem(SESSION_KEY);
        setView("all");
      }
    });

    /* ---------- Clima e relógio ---------- */
    const WEATHER = {
      latitude: -26.9101,
      longitude: -48.6705,
      refreshMs: 10 * 60 * 1000
    };

    function weatherLabel(code){
      if(code === 0) return "Céu limpo";
      if(code === 1) return "Predominantemente limpo";
      if(code === 2) return "Parcialmente nublado";
      if(code === 3) return "Nublado";
      if(code === 45 || code === 48) return "Neblina";
      if(code === 51 || code === 53 || code === 55) return "Garoa";
      if(code === 56 || code === 57) return "Garoa congelante";
      if(code === 61 || code === 63) return "Chuva";
      if(code === 65) return "Chuva forte";
      if(code === 66 || code === 67) return "Chuva congelante";
      if(code === 71 || code === 73 || code === 75 || code === 77) return "Neve";
      if(code === 80 || code === 81) return "Pancadas de chuva";
      if(code === 82) return "Pancadas fortes";
      if(code === 85 || code === 86) return "Pancadas de neve";
      if(code === 95) return "Trovoadas";
      if(code === 96 || code === 99) return "Trovoadas com granizo";
      return "Condição atual";
    }

    async function updateWeather(){
      const tempEl = document.getElementById("weatherTemp");
      const conditionEl = document.getElementById("weatherCondition");

      try{
        const url =
          "https://api.open-meteo.com/v1/forecast?latitude=" + WEATHER.latitude +
          "&longitude=" + WEATHER.longitude +
          "&current=temperature_2m,weather_code,is_day" +
          "&timezone=America%2FSao_Paulo";

        const response = await fetch(url, { cache:"no-store" });
        if(!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        const current = data.current;
        if(!current || typeof current.temperature_2m !== "number"){
          throw new Error("Dados meteorológicos inválidos");
        }

        tempEl.textContent = Math.round(current.temperature_2m) + "°C";
        tempEl.classList.remove("is-empty");
        conditionEl.textContent = weatherLabel(current.weather_code);
      }catch(error){
        console.warn("Não foi possível atualizar o clima:", error);
        tempEl.textContent = "--°C";
        tempEl.classList.add("is-empty");
        conditionEl.textContent = "Clima indisponível";
      }
    }

    function updateClock(){
      const now = new Date();
      const date = new Intl.DateTimeFormat("pt-BR", { weekday:"short", day:"2-digit", month:"short" })
        .format(now).replace(/\./g, "");
      const time = new Intl.DateTimeFormat("pt-BR", { hour:"2-digit", minute:"2-digit" }).format(now);
      document.getElementById("dateText").textContent = date;
      document.getElementById("clock").textContent = time;
    }

    applyTheme(document.documentElement.getAttribute("data-theme") || "dark");
    updateClock();
    setInterval(updateClock, 30000);
    updateWeather();
    setInterval(updateWeather, WEATHER.refreshMs);
    renderRail();
    render();
  </script>
</body>
</html>
